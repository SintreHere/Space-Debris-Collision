[project]
name = "conjunction-risk-estimator"
version = "0.1.0"
description = "Conjunction & collision risk estimator for LEO objects — algorithmic core"
requires-python = ">=3.11"
dependencies = [
    "spacetrack>=1.4.0",   # official-ish Python client for Space-Track.org API
    "httpx>=0.27.0",       # async HTTP client, used for CelesTrak fallback
    "sgp4>=2.23",          # TLE propagation (industry-standard algorithm)
    "astropy>=6.0.0",      # time handling, coordinate frames
    "numpy>=1.26.0",
    "scipy>=1.12.0",       # minimum-distance optimization (Phase 3)
    "pydantic>=2.6.0",     # data validation for TLE records
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",    # Phase 3 API layer
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",         # linting/formatting
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conjunction"]

[tool.ruff]
line-length = 100
